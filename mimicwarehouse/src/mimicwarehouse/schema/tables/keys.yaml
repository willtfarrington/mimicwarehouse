  mimiciv_hosp.d_icd_procedures: [icd_code, icd_version]
  mimiciv_hosp.d_labitems: [itemid]
  mimiciv_hosp.drgcodes: null
  mimiciv_hosp.emar_detail: null
  mimiciv_hosp.emar: [emar_id]
  mimiciv_hosp.hcpcsevents: [hadm_id, hcpcs_cd, seq_num]
  mimiciv_hosp.labevents: [labevent_id]
  mimiciv_hosp.microbiologyevents: [microevent_id]
  mimiciv_hosp.omr: null
  mimiciv_hosp.patients: [subject_id]
  mimiciv_hosp.pharmacy: [pharmacy_id]
  mimiciv_hosp.poe_detail: [poe_id, field_name]
  mimiciv_hosp.poe: [poe_id]
  mimiciv_hosp.prescriptions: [pharmacy_id, drug_type, drug]
  mimiciv_hosp.procedures_icd: [hadm_id, seq_num, icd_code, icd_version]
  mimiciv_hosp.provider: null
  mimiciv_hosp.services: [hadm_id, transfertime, curr_service]
  mimiciv_hosp.transfers: [transfer_id]
  # icu (constraint.sql)
  mimiciv_icu.caregiver: null
  mimiciv_icu.chartevents: null
  mimiciv_icu.datetimeevents: [stay_id, itemid, charttime]
  mimiciv_icu.d_items: [itemid]
  mimiciv_icu.icustays: [stay_id]
  mimiciv_icu.ingredientevents: null
  mimiciv_icu.inputevents: [orderid, itemid]
  mimiciv_icu.outputevents: [stay_id, charttime, itemid]
  mimiciv_icu.procedureevents: [orderid]
  # ed (no upstream constraint file)
  mimiciv_ed.diagnosis: null
  mimiciv_ed.edstays: null
  mimiciv_ed.medrecon: null
  mimiciv_ed.pyxis: null
  mimiciv_ed.triage: null
  mimiciv_ed.vitalsign: null
  # note (no upstream constraint file)
  mimiciv_note.discharge: null
  mimiciv_note.radiology: null
  mimiciv_note.discharge_detail: null
  mimiciv_note.radiology_detail: null

uniqueness_hints:
  mimiciv_hosp.drgcodes: [hadm_id, drg_type, drg_code]
  mimiciv_hosp.emar_detail: [emar_id, parent_field_ordinal]
  mimiciv_hosp.omr: [subject_id, chartdate, seq_num, result_name]
  mimiciv_hosp.provider: [provider_id]
  mimiciv_icu.caregiver: [caregiver_id]
  mimiciv_icu.chartevents: [stay_id, charttime, itemid]
  mimiciv_icu.ingredientevents: [orderid, itemid]
  mimiciv_ed.diagnosis: [stay_id, seq_num]
  mimiciv_ed.edstays: [stay_id]
  mimiciv_ed.medrecon: [stay_id, charttime, name, gsn, etc_rn]
  mimiciv_ed.pyxis: [stay_id, charttime, med_rn, gsn_rn]
  mimiciv_ed.triage: [stay_id]
  mimiciv_ed.vitalsign: [stay_id, charttime]
  mimiciv_note.discharge: [note_id]
  mimiciv_note.radiology: [note_id]
  mimiciv_note.discharge_detail: [note_id, field_name, field_ordinal]
  mimiciv_note.radiology_detail: [note_id, field_name, field_ordinal]

