# mimicwarehouse schema contract - keys (EP-9).
#
# primary_keys: exactly what the vendored mimic-code constraint.sql declares (hosp/icu); null
#   where upstream declares none - including tables that are obviously unique on one column
#   (provider, caregiver): the contract records upstream truth, EP-28/EP-44 test candidates.
#   ED and Note have no upstream constraint file, so every ED/Note primary key is null.
# uniqueness_hints: candidate unique column sets for tables without a declared PK, from the
#   MIMIC documentation - to be *tested* by the integrity tests, never asserted. Known caveats
#   are in the table comments (chartevents has upstream duplicates).
# foreign_keys: `source: constraint.sql` rows are verbatim from the vendored file (order kept)
#   and are drift-checked; `source: docs` rows tie ED / Note into hosp per the MIMIC-IV-ED /
#   -Note documentation (no upstream constraint file exists) and are not drift-checked. Further
#   documented links inside hosp/icu (provider ids, emar -> pharmacy/poe, transfers -> admissions
#   ...) are left to EP-28's integrity tests.
# Keys are metadata: Table.duckdb_ddl() never emits PRIMARY KEY / FOREIGN KEY constraints.
version_note: "MIMIC-IV 3.1 (mimic-code constraint.sql @ EP-8 pin) + MIMIC-IV-ED 2.2 + MIMIC-IV-Note 2.2 documented keys; curated 2026-08-17 (EP-9)."

primary_keys:
  # hosp (constraint.sql)
  mimiciv_hosp.admissions: [hadm_id]
  mimiciv_hosp.d_hcpcs: [code]
  mimiciv_hosp.diagnoses_icd: [hadm_id, seq_num, icd_code, icd_version]
