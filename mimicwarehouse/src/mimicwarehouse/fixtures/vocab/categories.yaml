insurance: [["Medicare", 45], ["Medicaid", 12], ["Private", 30], ["Other", 10], ["No charge", 1]]
language: [["English", 82], ["Spanish", 5], ["Portuguese", 3], ["Russian", 2], ["Chinese", 2], ["Haitian", 1], ["Vietnamese", 1], [null, 4]]
marital_status: [["MARRIED", 45], ["SINGLE", 30], ["WIDOWED", 12], ["DIVORCED", 8], [null, 5]]
race: [["WHITE", 55], ["BLACK/AFRICAN AMERICAN", 12], ["HISPANIC/LATINO - PUERTO RICAN", 3], ["HISPANIC OR LATINO", 3], ["ASIAN", 3], ["ASIAN - CHINESE", 2], ["WHITE - OTHER EUROPEAN", 3], ["BLACK/CAPE VERDEAN", 2], ["OTHER", 5], ["UNKNOWN", 5], ["PATIENT DECLINED TO ANSWER", 2], ["UNABLE TO OBTAIN", 2], ["PORTUGUESE", 2], ["AMERICAN INDIAN/ALASKA NATIVE", 1]]
