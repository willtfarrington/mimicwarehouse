# Provider order entry: non-medication order types and their poe_detail fields.
poe_nonmed_types:
  - {order_type: "Lab", order_subtype: null, weight: 5}
  - {order_type: "ADT orders", order_subtype: "Admit", weight: 2, details: [["Admit to", "Medicine"], ["Level of Urgency", "Routine"], ["Admit category", "Observation"]]}
  - {order_type: "ADT orders", order_subtype: "Discharge", weight: 2, details: [["Discharge Planning", "Home"], ["Discharge When", "Today"]]}
  - {order_type: "Consults", order_subtype: "Consult", weight: 2, details: [["Consult Status", "Requested"], ["Consult Status Time", null]]}
