poe_med_subtypes: [["Unit Dose", 5], ["IV Piggyback", 2], ["IV Large Volume", 1]]
emar_events: [["Administered", 20], ["Not Given", 2], ["Delayed Administered", 1], ["Flushed", 1]]
emar_infusion_events: ["Started", "Rate Change", "Stopped"]
lab_priorities: [["ROUTINE", 7], ["STAT", 3]]
# Lab comments: mostly NULL; the non-null ones deliberately include commas, double quotes and
# embedded newlines (the writer must quote them; the loader must survive them). No line inside
# a comment ends with whitespace (pre-commit trailing-whitespace hook).
lab_comments:
  - "SPECIMEN SLIGHTLY HEMOLYZED, MAY AFFECT POTASSIUM"
  - "VERIFIED BY REPLICATE ANALYSIS"
  - "PATIENT ON \"SLIDING SCALE\" INSULIN PER NURSING"
  - "NOTIFIED ___ AT 14:32\nVERIFIED BY DILUTION\nREPEAT SAMPLE REQUESTED"
  - "MODERATELY LIPEMIC, RESULTS MAY BE AFFECTED"
  - "CRITICAL VALUE, CALLED TO ___ AT ___\nREAD BACK CONFIRMED"
