  non_ed: [["PHYSICIAN REFERRAL", 5], ["TRANSFER FROM HOSPITAL", 3], ["CLINIC REFERRAL", 2], ["PROCEDURE SITE", 1], ["TRANSFER FROM SKILLED NURSING FACILITY", 1], ["PACU", 1], ["INFORMATION NOT AVAILABLE", 1]]
