# mimicwarehouse fixture seed - categorical vocabularies (EP-11). Hand-typed from the public
# MIMIC-IV documentation (mimic.mit.edu: admissions, transfers, services, drgcodes, omr,
# microbiologyevents, poe), never from `source material/`. Each weighted list is
# `[value, weight]`; a null value means "write NULL" with that weight.
version_note: "MIMIC-IV 3.1 categorical vocabularies for the fixture, typed 2026-08-18 (EP-11)."
anchor_year_groups: ["2008 - 2010", "2011 - 2013", "2014 - 2016", "2017 - 2019", "2020 - 2022"]
admission_types:
  ed: [["EW EMER.", 8], ["EU OBSERVATION", 2], ["OBSERVATION ADMIT", 2], ["DIRECT EMER.", 1]]
  non_ed: [["ELECTIVE", 3], ["URGENT", 4], ["SURGICAL SAME DAY ADMISSION", 2], ["OBSERVATION ADMIT", 1], ["DIRECT EMER.", 1], ["DIRECT OBSERVATION", 1], ["AMBULATORY OBSERVATION", 1]]
admission_locations:
