# mimicwarehouse fixture seed - d_labitems (EP-11).
#
# Hand-typed from public documentation (mimic.mit.edu d_labitems, the vendored mimic-code
# measurement concepts) - never from `source material/`. Real itemids are used on purpose:
# concepts (EP-37) and phenotypes (EP-41/42) look labs up by number. Ranges are coarse
# "plausible" sampling bounds (low/high) plus the reference range the fixture writes into
# labevents.ref_range_lower / ref_range_upper; `decimals` fixes the text form of `value`.
# `panel` groups items into specimen draws; `text_values` items carry no valuenum.
version_note: "MIMIC-IV 3.1 d_labitems subset (~44 items), typed 2026-08-18 (EP-11)."
