# mimicwarehouse fixture seed - d_items + caregiver (EP-12).
#
# Hand-typed from public documentation (mimic.mit.edu d_items / chartevents / inputevents /
# outputevents / procedureevents pages and the vendored mimic-code concepts) - never from
# `source material/`. Real MetaVision itemids are used on purpose for everything a concept
# (EP-37) or mart (EP-55) looks up by number: vitals, GCS, FiO2 / ventilator settings, weight
# and height, vasoactives, fluids, propofol, insulin, urine, ventilation / line / dialysis
# procedures. The `datetimeevents` and `ingredientevents` items - which no vendored concept
# reads - carry deliberately fixture-only ids in the 240xxx band (above every real MetaVision
# id, still > 220000 like the docs describe) so nobody mistakes them for a real dictionary row.
# `label / abbreviation / linksto / category / unitname / param_type / low- / highnormalvalue`
# are the d_items columns (approximate upstream text; a fixture, not a copy); `role` names the
# generator that writes the item, `low` / `high` / `decimals` are the numeric sampling bounds
# and text form of `value`, `text_values` are `[value, valuenum]` pairs for text items.
# Non-ASCII units are written as YAML escapes ("\u00b0F") so this file stays ASCII.
