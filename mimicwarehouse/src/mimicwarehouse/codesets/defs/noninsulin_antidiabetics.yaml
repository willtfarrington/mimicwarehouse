# mimicwarehouse code set (EP-40). ASCII only; the (id, version) pair is frozen in
# codesets.lock.json - bump version to change.
id: noninsulin_antidiabetics
version: "1.0.0"
name: Non-insulin antidiabetic drugs (drug names)
description: >
  Blood-glucose-lowering drugs other than insulin (WHO ATC A10B) as substrings of
  prescriptions.drug / emar.medication: metformin (biguanides), sulfonylureas, DPP-4
  inhibitors, SGLT2 inhibitors, GLP-1 receptor agonists, thiazolidinediones, meglitinides,
  alpha-glucosidase inhibitors and pramlintide - generic names plus common US brands.
kind: drug
members:
  drugs:
    match: contains
    names:
      - metformin
      - glucophage
      - glumetza
      - fortamet
      - riomet
      - glyburide
