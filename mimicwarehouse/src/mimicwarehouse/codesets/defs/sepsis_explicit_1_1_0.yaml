notes: >
  Superset of sepsis_explicit@1.0.0. The nine added codes are the accepted rows of the
  EP-172 decision ledger (roadmap/EP-172-gem-review-adjudication.md, completion note): each
  is the cross-era twin of a code the set already carried (020.2 -> A20.7, 036.2 -> A39.4,
  054.5 -> B00.7, 449 -> I76; A02.1 -> 003.1, B37.7 -> 112.5, O85 -> 670.22 / 670.24,
  T81.12- -> 998.02), and 112.5 is itself on the Martin et al. 2003 explicit list. Rejected
  at the same review, on purpose: 027.0 / 027.1 / 098.89 (the whole disease, not its
  septicaemic form - septicaemic cases carry 038.x), 909.3 / V58.89 (generic late-effect /
  aftercare codes behind T81.12XS / T81.12XD). Not proposed by the GEM and therefore not
  ruled on: the siblings A39.2 / A39.3 (acute / chronic meningococcemia) and 670.20
  (puerperal sepsis, episode unspecified). Era caveats: 670.2x exists from FY2009 and
  998.02 from FY2011 in ICD-9-CM; R65.2- covers severe sepsis with and without septic
  shock; T81.44- (sepsis following a procedure) exists only from FY2020, T81.12-
  (postprocedural septic shock) from FY2017 - earlier admissions carry none. Bacteremia
  (790.7 / R78.81) is deliberately excluded.
