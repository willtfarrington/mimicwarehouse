# mimicwarehouse code set (EP-40; this version EP-172). ASCII only; codes quoted, dots
# omitted as in MIMIC-IV; the (id, version) pair is frozen in codesets.lock.json - bump
# version to change. 1.1.0 = 1.0.0 + the nine GEM proposals the owner accepted at the
# EP-172 review (decision ledger in roadmap/EP-172-gem-review-adjudication.md); the 1.0.0
# pair stays locked and valid.
id: sepsis_explicit
version: "1.1.0"
name: Sepsis, explicitly coded (septicemia, sepsis, severe sepsis, septic shock)
description: >
  The "explicit" sepsis diagnosis codes: septicemia / sepsis by organism (ICD-9-CM 038.x
  and the organism-specific septicemia codes, ICD-10-CM A40.- / A41.- and the
  organism-specific sepsis codes), sepsis and severe sepsis (995.91 / 995.92; R65.20),
  septic shock (785.52; R65.21), puerperal sepsis (670.22 / 670.24; O85) and postprocedural
  sepsis / septic shock (998.02; T81.12- / T81.44-). A billing-code definition, not the
  Sepsis-3 clinical criteria (EP-42 builds that from the mimic-code concept). Version
  1.1.0 folds in the counterpart codes the CMS 2018 GEM review proposed and the owner
  accepted (EP-172): the ICD-9 arm gains 003.1, 112.5, 670.22, 670.24 and 998.02; the
  ICD-10 arm gains A20.7, A39.4, B00.7 and I76.
