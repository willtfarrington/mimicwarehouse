# mimicwarehouse code set (EP-40). ASCII only; codes quoted, dots omitted as in MIMIC-IV;
# the (id, version) pair is frozen in codesets.lock.json - bump version to change.
#
# The 17 Charlson comorbidity categories of Quan et al. (2005) transcribed from the vendored
# mimic-code comorbidity/charlson.sql as executed here - i.e. with the EP-38 patch
# charlson-c4a-exclusion-pr2142 applied (the ICD-10 malignancy range C45-C58 split into
# C45-C49 / C50-C58 so C4A, Merkel cell carcinoma, is excluded). Every rule is a prefix
# rule, mirroring the SUBSTRING(icd_code, 1, n) logic; a SQL BETWEEN range is written out
# as the prefixes it spans. One simplification: the ICD-9 range SUBSTRING(1, 4) BETWEEN
# '1740' AND '1958' is written as the three-digit prefixes 174-195 (no ICD-9-CM code
# starts with 1959, so the two are equivalent on the dictionary).
id: charlson_groups
version: "1.0.0"
name: Charlson comorbidity categories (Quan 2005, 17 groups)
description: >
  The 17 Charlson comorbidity categories as ICD-9-CM and ICD-10 code groups (Quan et al.
  2005), one member_group per category, transcribed from the vendored mimic-code
  charlson.sql with the EP-38 C4A exclusion applied. Weights and the index are the
  concept's business (mimiciv_derived.charlson); this set only names the codes.
kind: icd_dx
members:
