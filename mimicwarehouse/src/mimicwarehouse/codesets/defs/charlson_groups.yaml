notes: >
  Quan's ICD-10 lists are WHO ICD-10 codes; the ICD-10-CM extensions C7A / C7B (neuroendocrine
  tumours) stay unmapped as upstream documents, and C4A is excluded by the EP-38 patch.
  Thirty-seven of the 289 ICD-10 rules are WHO-only codes with no ICD-10-CM counterpart
  (B21, B22, B24, C97, E10.0 / E10.7, E11.7, E12.x, E13.7, E14.x, F00, F05.1, I64, I79.2,
  I85.9, I98.2, J46, Z49.1, Z49.2) and match nothing on this warehouse - kept for fidelity
  to the publication and the executed concept, so the icd10 arm validates at ~87 %, not the
  90 % the hand-typed sets reach.
