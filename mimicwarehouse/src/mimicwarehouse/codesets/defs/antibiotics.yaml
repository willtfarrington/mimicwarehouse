# mimicwarehouse code set (EP-40). ASCII only; the (id, version) pair is frozen in
# codesets.lock.json - bump version to change.
id: antibiotics
version: "1.0.0"
name: Antibiotics (mimic-code antibiotic.sql name list)
description: >
  The substring list of the vendored mimic-code medication/antibiotic.sql concept
  (LOWER(drug) LIKE '%name%'), transcribed once and de-duplicated; the concept's route and
  form exclusions (topical, eye / ear routes, creams, gels, desensitization orders) are
  phenotype logic, not part of the code set.
