# mimicwarehouse curated item catalogue (EP-39; units.py; ASCII only).
#
# One entry per curated itemid: the source event table, the label as it reads in
# d_items / d_labitems, a concept_group (items of one group share the canonical unit), the
# canonical unit, the accepted unit strings with their conversion to the canonical unit
# (`identity`, a numeric factor, or a named affine formula from units.FORMULAS), inclusive
# plausibility bounds in the canonical unit, a curation note, the mimic-code file the itemid
# was copied from (or the dictionary lookup that verified it) and a per-item version.
#
# Unit strings are matched after units.normalize_unit(): whitespace removed, degree sign and
# a leading `deg` dropped, micro signs folded to `u`, casefolded, trailing dot removed - so
# "degF", "deg F", "F" and the degree-sign form all read as the one key written here. The
# key "" stands for a NULL / blank unit (the itemid implies the unit; see docs/methods/units.md).
# Itemids come from the vendored mimic-code concepts_duckdb files named in source_ref and were
# verified against meta.itemids (d_items + d_labitems) through `mwh sql` on the dev tier on
# 2026-09-06; the three items without a concept reference were verified the same way.
# Bounds are wide sanity bounds (not reference ranges), inclusive at both ends.
