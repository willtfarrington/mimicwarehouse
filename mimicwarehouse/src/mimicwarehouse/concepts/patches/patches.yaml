# concepts/patches/patches.yaml -- the concept patch registry (EP-38; D-19).
# One entry per patched concept; the vendored tree is never edited. Refresh the
# sql_sha256 fields and re-validate: uv run python -m mimicwarehouse.concepts.patches
maintained_by: "mimicwarehouse.concepts.patches (EP-38; hand-maintained registry)"
patches:
  - patch_id: "apsiii-equidistant-arms"
    concept: apsiii
    reason: "The six 'values are equidistant' CASE arms (resp_rate, hematocrit, wbc, sodium, albumin, glucose) compared the max arm to itself (always true) instead of to the min arm. The arms are only reached when the two distances are equal, so scores do not change; ported so the SQL states its intent and matches upstream once merged."
    upstream_ref: "https://github.com/MIT-LCP/mimic-code/pull/2137"
    applies_to_upstream_commit: "8bcbd190ca75670cd5281f9ead3611ae1cefb73e"
    sql_sha256: "d7c63a3b1477a9fc51187a4232d16095e040f29292e2f0026ffbe757c8e8b8e1"
    date: "2026-09-05"
    status: ported-unmerged
    semantics: unchanged
  - patch_id: "charlson-exclude-c4a"
    concept: charlson
    reason: "malignant_cancer counted ICD-10-CM C4A (Merkel cell carcinoma), a skin malignancy Quan et al. (2005) exclude, because 'C4A' sorts lexically inside BETWEEN 'C45' AND 'C58'. The range is split into C45-C49 and C50-C58. C7A/C7B (neuroendocrine tumours, ICD-10-CM extensions absent from Quan) stay unmapped, as upstream PR #2142 chooses; the alternative PR #2043 would add them."
    upstream_ref: "https://github.com/MIT-LCP/mimic-code/pull/2142"
    applies_to_upstream_commit: "8bcbd190ca75670cd5281f9ead3611ae1cefb73e"
    sql_sha256: "a6f0584e0f3344a508e795b669af5ce9dbdc38af3289e22c6d216723ed41e463"
    date: "2026-09-05"
    status: ported-unmerged
    semantics: changed
  - patch_id: "cbc-mchc-valueuom"
    concept: complete_blood_count
    reason: "MCHC (itemid 51249) is sometimes recorded with valueuom '%' in error (upstream issue #1922); only g/dL rows feed the mchc column, and a 51249 row with another unit no longer qualifies the specimen."
    upstream_ref: "https://github.com/MIT-LCP/mimic-code/pull/2141"
    applies_to_upstream_commit: "8bcbd190ca75670cd5281f9ead3611ae1cefb73e"
    sql_sha256: "45244fbe7183a8a980387cab6410ecea6628ab30999b65de9d0203080aa671e1"
    date: "2026-09-05"
    status: ported-unmerged
    semantics: changed
  - patch_id: "inflammation-crp-valueuom"
    concept: inflammation
    reason: "CRP (itemid 50889) rows whose valueuom is not mg/L, including rows with a missing unit, are excluded from crp and from the specimen filter (upstream issue #1922); mg/L is the expected unit."
    upstream_ref: "https://github.com/MIT-LCP/mimic-code/pull/2141"
    applies_to_upstream_commit: "8bcbd190ca75670cd5281f9ead3611ae1cefb73e"
    sql_sha256: "a6e86ec09fc3d423d7751279146df51ae31cf330d5f73c87a648f0aacfda8e1f"
    date: "2026-09-05"
    status: ported-unmerged
    semantics: changed
  - patch_id: "sirs-wbc-guard"
    concept: sirs
    reason: "The wbc_score missing-data guard tested COALESCE(wbc_min, bands_max) only, so a stay whose first-day wbc_min is null but whose wbc_max is present and normal scored NULL (imputed 0 in the total, but lost as a component) instead of 0; wbc_max joins the guard. first_day_lab derives wbc_min and wbc_max from one column, so they are null together and the ported guard changes no real-data value; the crafted regression case is the reachable-in-principle input."
    upstream_ref: "https://github.com/MIT-LCP/mimic-code/pull/2146"
    applies_to_upstream_commit: "8bcbd190ca75670cd5281f9ead3611ae1cefb73e"
    sql_sha256: "cf658ba911859761231a7cf5cc13f8ee63c1e04d1ff0923c4a5b77ee4c7cfb4b"
    date: "2026-09-05"
    status: ported-unmerged
    semantics: unchanged
