# dag/specs/qc.yaml -- the data-quality profiling steps (EP-44; ASCII only). GENERATED
# by `python -m mimicwarehouse.qc` from the EP-9 contract + qc/thresholds.yaml
# (mimicwarehouse.qc.profile.spec_document; test_ep44 asserts no drift) - edit the
# generator, not this file. Merged into the one graph by dag.spec.load_dag() (EP-37
# discovery): one python step per contract table of the staged schemas (its profile +
# checks on the build connection, a JSON slice under lake/meta/<tier>/raw/qc/), the
# qc.checks step (thresholds, the four meta.qc_* tables inside a kind: qc run), the
# qc.report step (runs/<run_id>/qc_report.md + CSVs) and the shared catalog step, whose
# depends_on / tags are unioned with the other specs' so `mwh build --tier <t> --tag qc`
# ends in a catalog rebuild. No target: the steps re-run whenever selected. A profile
# step depends on meta.profile (it reuses EP-29's null / distinct / min / max), on its
# table's stage step, on the stage steps of the tables its foreign keys reference and on
# icustays where the event-window rule applies.
