# dag/specs/marts.yaml -- the latency-mart steps (EP-55 item 4; ASCII only). Merged into the
# one graph by dag.spec.load_dag() (EP-37 discovery): one python step per mart spec
# (marts/specs/<name>.yaml; its depends_on mirrors the spec's, a test pins the pair) and the
# shared catalog step, whose depends_on / tags are unioned with the other specs' so
# `mwh build --tier <t> --tag marts` builds every mart (with EP-47's cohorts.build, which
# carries the same tag) and ends in a catalog rebuild; `--select marts.<name>` builds one.
#   marts.icustay_first_day -> lake/marts/<tier>/icustay_first_day/subject_bucket=NN/
#                              part-0.parquet (one sorted file per bucket) + manifest.json;
#                              the catalog extension (marts.registry.register_marts)
#                              exposes marts.icustay_first_day and the registry tables
#                              meta.mart_tables / meta.mart_columns.
#   marts.itemid_daily      -> lake/marts/<tier>/itemid_daily/subject_bucket=NN/part-0.parquet
#                              (EP-175: per stay x curated itemid x ICU day; the
#                              chartevents scan, the largest the marts make).
#   marts.itemid_summary    -> lake/marts/<tier>/itemid_summary/part-0.parquet (EP-175: one
#                              row per curated itemid, k-suppressed at build time; a
#                              safe.REGISTRY_TABLES member).
#   marts.icustay_hourly    -> lake/marts/<tier>/icustay_hourly/subject_bucket=NN/
#                              part-0.parquet (EP-56: per stay x hour bin, 21 variables from
#                              five mimic-code concepts; hour cap
#                              Settings.marts_hourly_max_hours, in the manifest's params).
#   marts.hourly_variables  -> lake/marts/<tier>/hourly_variables/part-0.parquet (EP-56: the
#                              hourly mart's dictionary, from its spec and the EP-39
#                              catalogue; reads nothing from the lake; a registry table).
#   marts.hourly_population -> lake/marts/<tier>/hourly_population/part-0.parquet (EP-56: hour
#                              x variable x era quantiles over the published hourly mart,
#                              k-suppressed at build time; a safe.REGISTRY_TABLES member).
# The target is the per-tier status key marts.<name>: a mart complete for the tier is skipped
# (a spec change rebuilds with --force; the status entry records the spec_sha256 it was
# built from). The full tier runs as a detached job: `mwh build --tier full --tag marts
# --background --job <name>` (EP-55: ep55-marts-full; EP-175: ep175-rollups-full; EP-56:
# ep56-hourly-full with --select marts.icustay_hourly,marts.hourly_population). The
# units.* dependencies order a whole-DAG build only: those steps carry no target, and a
# --tag marts build never selects them.
version: 1
steps:
  - name: marts.icustay_first_day
    kind: python
    callable: mimicwarehouse.marts.first_day:run_first_day
    target: marts.icustay_first_day
    tags: [marts]
    tiers: [fixture, demo, dev, full]
    depends_on:
      - stage.mimiciv_icu.icustays
      - stage.mimiciv_hosp.patients
      - stage.mimiciv_hosp.admissions
      - stage.mimiciv_hosp.services
      - concept.demographics.icustay_detail
      - concept.firstday.first_day_vitalsign
      - concept.firstday.first_day_lab
      - concept.firstday.first_day_bg_art
      - concept.firstday.first_day_gcs
      - concept.firstday.first_day_urine_output
      - concept.firstday.first_day_weight
      - concept.firstday.first_day_sofa
      - concept.firstday.first_day_rrt
      - concept.comorbidity.charlson
      - concept.sepsis.sepsis3
      - concept.treatment.ventilation
      - concept.medication.vasoactive_agent
      - concept.organfailure.kdigo_stages
  - name: marts.itemid_daily
    kind: python
    callable: mimicwarehouse.marts.itemid_rollups:run_itemid_daily
    target: marts.itemid_daily
    tags: [marts]
    tiers: [fixture, demo, dev, full]
    depends_on:
      - stage.mimiciv_icu.icustays
      - stage.mimiciv_icu.chartevents
      - stage.mimiciv_hosp.labevents
      - units.item_units
      - units.variants
      - units.dictionary
  - name: marts.itemid_summary
    kind: python
    callable: mimicwarehouse.marts.itemid_rollups:run_itemid_summary
    target: marts.itemid_summary
    tags: [marts]
    tiers: [fixture, demo, dev, full]
    depends_on:
      - stage.mimiciv_icu.icustays
      - stage.mimiciv_icu.chartevents
      - stage.mimiciv_hosp.labevents
      - units.item_units
      - units.variants
      - units.dictionary
  - name: marts.icustay_hourly
    kind: python
    callable: mimicwarehouse.marts.hourly:run_icustay_hourly
    target: marts.icustay_hourly
    tags: [marts]
    tiers: [fixture, demo, dev, full]
    depends_on:
      - stage.mimiciv_icu.icustays
      - concept.measurement.vitalsign
      - concept.measurement.chemistry
      - concept.measurement.complete_blood_count
      - concept.measurement.bg
      - concept.measurement.coagulation
  - name: marts.hourly_variables
    kind: python
    callable: mimicwarehouse.marts.hourly:run_hourly_variables
    target: marts.hourly_variables
    tags: [marts]
    tiers: [fixture, demo, dev, full]
  - name: marts.hourly_population
    kind: python
    callable: mimicwarehouse.marts.hourly:run_hourly_population
    target: marts.hourly_population
    tags: [marts]
    tiers: [fixture, demo, dev, full]
    depends_on:
      - marts.icustay_hourly
      - stage.mimiciv_hosp.patients
  - name: catalog
    kind: catalog
    tags: [catalog, marts]
    depends_on:
      - marts.icustay_first_day
      - marts.itemid_daily
      - marts.itemid_summary
      - marts.icustay_hourly
      - marts.hourly_variables
      - marts.hourly_population
