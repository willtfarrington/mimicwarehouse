# dag/specs/measurement.yaml -- the measurement-process steps (EP-45; ASCII only). Merged
# into the one graph by dag.spec.load_dag() (EP-37 discovery): three python steps that
# each scan the event tables once on the build connection and write a raw slice under
# lake/meta/<tier>/raw/measurement/ (data root only), the measurement.report step that
# reads the slices, opens the one kind: qc run, k-suppresses (disclose.suppress) and
# writes the six meta.mp_* tables under lake/meta/<tier>/ (EP-29's layout; registered as
# meta.<table> by EP-37's walker) plus runs/<run_id>/measurement_process.md + CSVs, and
# the shared catalog step, whose depends_on / tags are unioned with the other specs' so
# `mwh build --tier <t> --tag measurement` ends in a catalog rebuild. No target: the steps
# re-run whenever selected. Each python step takes optional `params` (EP-45 extension of
# the spec: mimicwarehouse.qc.measurement.MeasurementParams) - itemids (a subset of the
# EP-39 curated catalogue; default every curated item), hours (168), days (14),
# first_window_hours (24), min_stays (50), sparse_share (0.05); the slices record the
# params they were computed with and the report step refuses slices that disagree.
#   measurement.hourly     -> hourly / daily grids + per-item statistics (slice)
#   measurement.structural -> itemid x first_careunit x era cells (slice)
#   measurement.presence   -> mortality arms per curated lab (slice)
#   measurement.report     -> meta.mp_item_hourly, mp_item_daily, mp_item_summary,
#                             mp_structural, mp_absence_summary, mp_presence_outcome
version: 1
steps:
  - name: measurement.hourly
    kind: python
    callable: mimicwarehouse.qc.measurement:run_hourly
    tags: [measurement, meta]
    tiers: [fixture, demo, dev, full]
    depends_on:
      - stage.mimiciv_icu.icustays
      - stage.mimiciv_hosp.patients
      - stage.mimiciv_icu.chartevents
      - stage.mimiciv_hosp.labevents
      - stage.mimiciv_icu.outputevents
      - stage.mimiciv_icu.inputevents
  - name: measurement.structural
    kind: python
    callable: mimicwarehouse.qc.measurement:run_structural
    tags: [measurement, meta]
    tiers: [fixture, demo, dev, full]
    depends_on:
      - stage.mimiciv_icu.icustays
      - stage.mimiciv_hosp.patients
      - stage.mimiciv_icu.chartevents
      - stage.mimiciv_hosp.labevents
      - stage.mimiciv_icu.outputevents
      - stage.mimiciv_icu.inputevents
  - name: measurement.presence
    kind: python
    callable: mimicwarehouse.qc.measurement:run_presence
    tags: [measurement, meta]
    tiers: [fixture, demo, dev, full]
    depends_on:
      - stage.mimiciv_icu.icustays
      - stage.mimiciv_hosp.patients
      - stage.mimiciv_hosp.admissions
      - stage.mimiciv_hosp.labevents
  - name: measurement.report
    kind: python
    callable: mimicwarehouse.qc.measurement:run_report
    tags: [measurement, meta]
    tiers: [fixture, demo, dev, full]
    depends_on:
      - measurement.hourly
      - measurement.structural
      - measurement.presence
  - name: catalog
    kind: catalog
    tags: [catalog, measurement]
    depends_on:
      - measurement.report
