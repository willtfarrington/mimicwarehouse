[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimicwarehouse"
version = "0.1.0"
description = "Local MIMIC-IV data lab: DuckDB + Parquet warehouse, Python backend, Streamlit Lab app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
authors = [{ name = "W. Taylor Farrington" }]
# Core set (D-13/D-15/D-17). Permissive licenses only (GOVERNANCE §10, D-34).
# duckdb is pinned exactly: one DuckDB version across every process (DESIGN §6);
# tests/ep/test_ep01.py asserts the installed version equals this pin.
dependencies = [
  "duckdb==1.5.5",
  "polars",
  "pyarrow",
  "pandas>=3",
  "numpy",
  "scipy",
  "statsmodels",
  "lifelines",
  "scikit-learn",
  "pydantic>=2",
  "pydantic-settings",
  "typer",
  "rich",
  "pyyaml",
  "jinja2",
  "altair>=5.5",
  # EP-19 (D-15 addendum, D-43 item 14): pid liveness for the build lock / jobs, RSS
  # sampling for the runner and EP-35/36; ships abi3 win_amd64 wheels (test_ep01).
  "psutil",
]

[project.scripts]
# UTF-8 entry point (EP-167): reconfigures stdio, then runs the typer app (cli.main stays
# the root callback; `python -m mimicwarehouse.cli` bypasses the reconfigure on purpose).
mwh = "mimicwarehouse.console:run"

[dependency-groups]
dev = [
  "pytest",
  "pytest-xdist",
  "hypothesis",
  "ruff",
  "pyright",
  "poethepoet",
  "pre-commit",
]
# Streamlit pins pyarrow<25 → `ui` is isolated from the heavy groups (roadmap Risk 3, D-21).
ui = [
  "streamlit==1.61.*",
  "vegafusion",
  "vl-convert-python",
  "plotly",
]
# Filled by later briefs; kept empty here on purpose:
gpu = []   # EP-121: torch (cu130 index, D-16), xgboost
gpl = []   # EP-93:  scikit-survival (GPL-3, D-34) — only ever through this group
text = []  # EP-148/150/151: medspaCy, sentence-transformers

[tool.uv]
package = true
python-preference = "only-managed"
default-groups = ["dev"]
# `ui` isolated from `gpu`/`text`; `dev` stays co-installable with `ui` so page tests can
# run `--group dev --group ui`.
conflicts = [
  [{ group = "ui" }, { group = "gpu" }],
  [{ group = "ui" }, { group = "text" }],
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# EP-121 uncomments this so torch resolves from the cu130 index on Windows (D-16):
# [tool.uv.sources]
# torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/mimicwarehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
extraPaths = ["src", "tests"]         # EP-168: tests/ep modules `import helpers` from tests/ (src listed too: extraPaths overrides pyright's auto src detection)

[tool.poe.tasks]
test = "pytest"                       # fixture tier (default; unmarked tests + tier("fixture")); serial on purpose
test-fast = "pytest -n auto"          # EP-168: xdist; suite is parallel-safe, but `test` stays the default (AV heuristics, D-42)
test-dev = "pytest --tier dev"        # EP-12/168: + tier("dev") tests (each skips while the artefact its needs= declares is missing)
test-full = "pytest --tier full"      # EP-12/168: + tier("full") tests (same skip rule)
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."   # EP-33 B5 (retro VT-15): the format gate `check` runs; `fmt` fixes what it reports
typecheck = "pyright"
guard = "mwh guard --staged"   # EP-4: what the pre-commit hook runs
roadmap-check = "python scripts/roadmap_check.py"   # EP-6: = mwh verify --roadmap [--strict] [--json]
vendor-mimic-code = "python -m mimicwarehouse.concepts.vendoring"   # EP-8: --sha <sha> [--src %TEMP%\mimic-code] [--dry-run]; outside `check`
check = ["lint", "fmt-check", "typecheck", "test"]   # EP-33 B5: fmt-check second (fast fail before pyright); fixture-only on purpose
