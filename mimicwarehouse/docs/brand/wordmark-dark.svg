  <text x="58" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif" font-size="27" font-weight="600" letter-spacing="-0.4" fill="#E6EDF3">mimicwarehouse</text>
